    case"seek":{const v=vEl();if(!v)break;vid.hold=false;v.currentTime=Math.max(0,+t.dataset.t-4);v.play().catch(()=>{});window.scrollTo({top:0,behavior:"smooth"});break}
    case"sendm":{const mm=S.matches[t.dataset.id];if(!mm)break;await saveFile(`empat-partido-${mm.date||"sin-fecha"}-${slug(mm.rival)||"rival"}.json`,matchFileText(mm),"Partido guardado: mándaselo a quien quieras");break}
    case"img":{showImage();break}
    case"imgclose":{if(ev.target!==t&&!t.matches("button"))break;closeBox("imgbox");break}
    case"imgsave":{const el=document.getElementById("imgbox");if(!el)break;const b=await cvBlob(el._cv);
      toast(browserSave(t.dataset.name,b)?"Imagen descargada. Si no la ves, mantén pulsada la imagen":"Aquí no se puede descargar: mantén pulsada la imagen");break}
    case"imgshare":{const el=document.getElementById("imgbox");if(!el)break;try{const b=await cvBlob(el._cv);const f=new File([b],t.dataset.name,{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast("Este navegador no deja compartir: descárgala")}catch(e){if(e&&e.name!=="AbortError")toast("No se pudo compartir: descárgala")}break}
    case"backup":{const ok=await saveFile("empat-copia-"+today()+".json",backupText(),"Copia guardada");if(ok)try{localStorage.setItem(BK_KEY,String(Date.now()))}catch(e){}if(ok&&ui.view==="team"&&!$("#copybox"))render();break}
    case"restoreopen":{ui.restore={open:true};render();break}
    case"restorecancel":{ui.restore=null;render();break}
    case"restoretxt":{const v=($("#restore-txt")||{}).value||"";ui.restore=Object.assign({open:true},parseBackup(v));render();break}
    case"restoredo":{const rs=ui.restore;if(!rs||!rs.d)break;applyBackup(rs);ui.restore=null;render();toast("Copia restaurada");break}
    case"undel":{const u=ui.undel;if(!u)break;clearTimeout(u.timer);ui.undel=null;S.matches[u.m.id]=u.m;delete S.deleted[u.m.id];saveLocal();ui.toast=null;renderToast();render();toast("Partido recuperado");break}
    case"copyex":{S.team.players=S.matches.ejemplo.players.map(p=>({id:newId(),num:p.num,name:p.name,pos:p.pos}));if(S.team.name==="Mi equipo")S.team.name="CV Ejemplo";teamChanged();render();break}
    case"tablereset":{S.team.table=clone(DEFAULT_TABLE);teamChanged();render();toast("Tabla por defecto");break}
    case"copy":{const txt=summaryText();try{await navigator.clipboard.writeText(txt);toast("Resumen copiado")}catch(e){showCopyBox(txt)}break}
    case"csv":{const txt=csvText();const sm=S.matches[ui.statsId];const name="empat-"+(ui.statsId==="season"?"temporada"+(compLabel()?"-"+slug(compLabel()):""):(sm.date||"sin-fecha")+"-"+(slug(sm.rival)||"rival")+(ui.statsSet!=="all"?"-set"+(+ui.statsSet+1):""))+".csv";
      await saveFile(name,txt,"CSV guardado");break}
  }
});
function showCopyBox(txt){const app=$("#app");const box=document.createElement("div");box.className="sheetcard";box.innerHTML=`<p class="hand">Copia este texto</p><textarea id="copybox" rows="8" style="font:13px/1.4 ui-monospace,monospace"></textarea>`;app.appendChild(box);const ta=box.querySelector("textarea");ta.value=txt;ta.focus();ta.select()}
function readNewForm(){const f=ui.newForm;if(!$("#nf-rival"))return;f.rival=$("#nf-rival").value;f.date=$("#nf-date").value;f.comp=$("#nf-comp").value;f.bestOf=+$("#nf-bo").value;f.pts=+$("#nf-pts").value;f.tie=+$("#nf-tie").value;
  f.roster=[...document.querySelectorAll(".nf-p")].filter(c=>c.checked).map(c=>c.value)}
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="restore-file"&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{ui.restore=Object.assign({open:true},parseBackup(String(fr.result)));render()};fr.onerror=()=>{ui.restore={open:true,err:"No se pudo leer el fichero"};render()};fr.readAsText(t.files[0]);return}
  if(t.id==="vid-file"&&t.files&&t.files[0]){const m=S.matches[ui.liveId];if(m)vidLoad(t.files[0],m);return}
  if(t.id==="vauto"){vid.auto=t.checked;return}
  if(t.id==="stats-sel"){ui.statsId=t.value;ui.statsSet="all";render();return}
  if(t.id==="map-sel"){ui.mapP=t.value;render();return}
  if(t.id==="share-names"&&share){share.names=t.checked;shareSave();render();livePush(true);return}
  if(t.id==="evo-sel"){ui.evoP=t.value;render();return}
  if(t.id==="print-pl"){const f=document.querySelector("#printbox iframe");if(f)f.srcdoc=printHTML(t.checked);return}
  if(t.id==="bigtxt"){try{localStorage.setItem(LS_KEY+"-letra",t.checked?"grande":"normal")}catch(e){}applyBig();return}
  if(t.id==="team-name"){S.team.name=t.value.trim()||"Mi equipo";teamChanged();render();return}
  if(t.dataset.lu&&ui.lu){if(t.dataset.lu==="p"){ui.lu.p[+t.dataset.i]=t.value||null}else ui.lu.setter=t.value||null;render();return}
  if(t.dataset.otab){const f=t.dataset.otab,r=t.dataset.r;if(!S.team.table)S.team.table=clone(DEFAULT_TABLE);if(!S.team.table[f])S.team.table[f]={};
    if(t.value)S.team.table[f][r]=t.value;else delete S.team.table[f][r];teamChanged();return}
  const row=t.closest(".prow[data-pid]");if(row){const p=S.team.players.find(x=>x.id===row.dataset.pid);if(!p)return;const fld=t.dataset.field;
    p[fld]=fld==="num"?(+t.value||0):t.value;teamChanged();return}
});
document.addEventListener("submit",ev=>{ev.preventDefault();
  if(ev.target.id==="accform"){accSubmit();return}
  if(ev.target.id==="addp"){const num=$("#np-num").value,name=$("#np-name").value.trim();if(num===""||!name)return;
    if(S.team.players.some(p=>p.num===+num)){toast("Ya hay un jugador con el dorsal "+num);return}
    S.team.players.push({id:newId(),num:+num,name,pos:$("#np-pos").value});teamChanged();render();setTimeout(()=>{const n=$("#np-num");if(n)n.focus()},0)}
});
document.addEventListener("keydown",ev=>{
  /* El Tab no se escapa del panel de jugada ni de los diálogos */
  if(ev.key==="Tab"){const box=document.querySelector("#sheet .sheet,#imgbox .card,#printbox .card");if(box){const f=[...box.querySelectorAll("button:not([disabled]),input,select,textarea,iframe")];
    if(f.length){const a=document.activeElement,i=f.indexOf(a);if(i<0){ev.preventDefault();f[0].focus()}else if(ev.shiftKey&&i===0){ev.preventDefault();f[f.length-1].focus()}else if(!ev.shiftKey&&i===f.length-1){ev.preventDefault();f[0].focus()}}}}
  if(ev.key==="Escape"&&ui.sheet){ui.sheet=null;renderSheet();return}
  if(ev.key==="Escape"&&document.getElementById("imgbox")){closeBox("imgbox");return}
  if(ev.key==="Escape"&&document.getElementById("printbox")){closeBox("printbox");return}
  const v=vEl();if(!v||!vidOn()||ui.sheet||/INPUT|TEXTAREA|SELECT/.test((ev.target||{}).tagName||""))return;
  if(ev.key==="k"||ev.key==="K"){ev.preventDefault();vid.hold=false;v.paused?v.play().catch(()=>{}):v.pause()}
  else if(ev.key==="ArrowLeft"){ev.preventDefault();v.currentTime=Math.max(0,v.currentTime-3)}else if(ev.key==="ArrowRight"){ev.preventDefault();v.currentTime+=3}});
setInterval(()=>{const el=document.getElementById("fol-ago");if(el&&fol.at){const a=Math.max(0,Math.round((Date.now()-fol.at)/1000));el.textContent=`Actualizado hace ${a<60?a+" s":Math.round(a/60)+" min"}. Solo lectura.`}},5000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;if(fol.code&&fol.err==="net")follow(fol.code);if(ui.view==="live"&&wake===null&&ui.liveId)keepAwake();reconnect()});
window.addEventListener("online",reconnect);

/* ---------- Arranque ---------- */
applyBig();
const had=loadLocal();
if(S.matches.ejemplo&&S.matches.ejemplo.exV!==makeExample.V){S.matches.ejemplo=makeExample();saveLocal()}
if(!had&&!Object.keys(S.matches).length){S.matches.ejemplo=makeExample();saveLocal()}
pickLive();
if(!ui.liveId&&S.matches.ejemplo&&S.matches.ejemplo.status==="live")ui.liveId="ejemplo";
render();
connect();
/* Sin internet: un service worker guarda la app (sw.js, lo genera tools/demo.mjs) y la abre aunque no haya red */
if("serviceWorker"in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
if(standalone())keepData();
window.__empat={get share(){return share},get acc(){return acc},accEnter,fbDb,liveSnapshot,seal,unseal,get S(){return S},replay,effective,normalizeMatch,mergeMatch,parseBackup,backupText,matchFileText,applyBackup,statsImage,computeStats,gather,printHTML,compKey,seasonMatches,get ui(){return ui}};
})();
</script>

<title>emPat Data</title>
<style>
/* Layout: app nativa de móvil — listas agrupadas en tarjetas blancas sobre gris, marcador grande arriba, botones grandes y redondeados, barra de pestañas abajo */
:root{
  --bg:#F2F3F6; --card:#ffffff; --fill:#EEF0F4; --fill-2:#E1E4EB; --ink:#0F1B33; --muted:#5F6B80; --sep:#E3E6EC;
  --brand:#0F1B33; --ball:#FF7A45;
  --us:#D4521C; --them:#3E5A8C; --bad:#C81E35; --good:#17804A; --mid:#94600A; --lib:#14806F;
  --us-tint:rgba(232,98,46,.12); --them-tint:rgba(62,90,140,.12); --bad-tint:rgba(215,38,61,.10); --good-tint:rgba(31,157,85,.12); --mid-tint:rgba(217,138,0,.13);
  --on-accent:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1222; --card:#131E33; --fill:#1C2942; --fill-2:#26355A; --ink:#F2F4F8; --muted:#9AA6BD; --sep:#1F2C47;
  --brand:#0F1B33; --ball:#FF7A45;
  --us:#FF7A45; --them:#8FA8D8; --bad:#FF5C6C; --good:#32c46f; --mid:#ffb02e; --lib:#3CC7B0;
  --us-tint:rgba(255,122,69,.18); --them-tint:rgba(143,168,216,.16); --bad-tint:rgba(255,92,108,.18); --good-tint:rgba(50,196,111,.18); --mid-tint:rgba(255,176,46,.18);
  --on-accent:#0F1B33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1222; --card:#131E33; --fill:#1C2942; --fill-2:#26355A; --ink:#F2F4F8; --muted:#9AA6BD; --sep:#1F2C47;
  --brand:#0F1B33; --ball:#FF7A45;
  --us:#FF7A45; --them:#8FA8D8; --bad:#FF5C6C; --good:#32c46f; --mid:#ffb02e; --lib:#3CC7B0;
  --us-tint:rgba(255,122,69,.18); --them-tint:rgba(143,168,216,.16); --bad-tint:rgba(255,92,108,.18); --good-tint:rgba(50,196,111,.18); --mid-tint:rgba(255,176,46,.18);
  --on-accent:#0F1B33; color-scheme:dark}
html,body{height:100%}
html.big #app,html.big #sheet .sheet{zoom:1.15}
details.help{background:var(--fill);border-radius:var(--r-sm);padding:10px 12px}
details.help summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--us)}
details.help dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
details.help dt{font-weight:700}details.help dd{margin:0;color:var(--muted)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--us);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:20px}
h1,h2{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:24px;line-height:1.15}
.hand{margin:0;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.hand.us{color:var(--us)} .hand.them{color:var(--them)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
/* Cabecera */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;flex:none;border-radius:11px;box-shadow:0 0 0 1px var(--sep)}
.brand h1{font-weight:800;letter-spacing:-.03em}
.brand h1 .bp{color:var(--us)}
.brand h1 .data{font-weight:600;color:var(--muted);letter-spacing:-.01em}
.brand .hand{margin:0;text-transform:none;letter-spacing:0;font-size:15px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="cloud"] i{background:var(--good)} .sync[data-s="offline"] i{background:var(--mid)} .sync[data-s="error"] i{background:var(--bad)}
/* Tarjetas */
.zone,.sheetcard{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.zone.bare{background:transparent;padding:0}
/* Botones */
.btn{border:0;background:var(--fill);border-radius:var(--r-sm);padding:10px 16px;font-weight:600;font-size:15px;min-height:44px;color:var(--us)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn.primary{background:var(--us);color:var(--on-accent)}
.btn.danger{color:var(--bad);background:var(--bad-tint)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){opacity:.7}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.tag.ex{background:var(--mid-tint);color:var(--mid)}
.tag.live{background:var(--bad-tint);color:var(--bad)}
/* Marcador */
.score{background:var(--card);border-radius:var(--r);padding:18px 16px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.score .t{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.score .tn{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.score .t.us .tn{color:var(--us)} .score .t.them .tn{color:var(--them)}
.score .n{font-family:var(--font-num);font-size:clamp(64px,18vw,96px);font-weight:700;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score .ts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.score .mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:30px}
.score .colon{font-size:40px;font-weight:300;color:var(--muted);line-height:1}
.score .setn{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.srv{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--muted);visibility:hidden}
.srv.on{visibility:visible;background:var(--us-tint);color:var(--us)}
.t.them .srv.on{background:var(--them-tint);color:var(--them)}
.srv::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.setline{display:flex;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.setline span{background:var(--fill);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.setline span.w{background:var(--us-tint);color:var(--us)} .setline span.l{background:var(--them-tint);color:var(--them)}
.note{background:var(--card);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:inset 0 0 0 2px var(--us)}
.note .hand{margin:0;text-transform:none;letter-spacing:0;font-size:17px;font-weight:600;color:var(--ink)}
/* Jugadores */
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.jsy{border:0;background:var(--fill);border-radius:var(--r-sm);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;min-height:62px}
.jsy .badge{grid-row:1/3}
.jsy .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jsy .tally{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.jsy .tally b{color:var(--good);font-weight:600} .jsy .tally em{color:var(--bad);font-style:normal;font-weight:600}
.jsy:active:not(:disabled){background:var(--fill-2)}
.jsy:disabled{opacity:.4;cursor:not-allowed}
.badge{width:42px;height:42px;border-radius:50%;background:var(--us);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;flex:none}
.badge.lib{background:var(--lib)}
.badge.lg{width:52px;height:52px;font-size:22px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.qbtn{border:0;border-radius:var(--r-sm);padding:10px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;font-size:15px;background:var(--fill)}
.qbtn small{font-weight:400;font-size:12px;color:var(--muted)}
.qbtn.us{background:var(--us-tint);color:var(--us)} .qbtn.them{background:var(--them-tint);color:var(--them)}
.qbtn:disabled{opacity:.4;cursor:not-allowed}
@media (min-width:640px){.quick{grid-template-columns:repeat(4,1fr)}}
/* Jugadas */
.feed{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.feed li{display:flex;gap:12px;align-items:center;font-size:15px;padding:9px 0;border-bottom:1px solid var(--sep)}
.feed li:last-child{border-bottom:0}
.feed .sc{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);min-width:46px;font-size:14px}
.code{font-weight:700;font-size:15px;min-width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
.r-good{color:var(--good);background:var(--good-tint)} .r-bad{color:var(--bad);background:var(--bad-tint)} .r-mid{color:var(--mid);background:var(--mid-tint)} .r-neu{color:var(--muted);background:var(--fill)}
.codes{font-size:12px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.codes b{color:var(--ink)}
/* Hoja de acciones */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet::before{content:"";align-self:center;width:38px;height:5px;border-radius:3px;background:var(--fill-2);margin-bottom:4px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 6px}
.frow{background:var(--card);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:8px}
.frow .fn{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.frow.hot{box-shadow:inset 0 0 0 2px var(--us)}
.frow.hot .fn{color:var(--us)}
.frow.hot .fn::after{content:" · lo más probable ahora";text-transform:none;letter-spacing:0;font-weight:500}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt{border:0;border-radius:10px;padding:6px 4px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:13px;line-height:1.2}
.opt b{font-size:19px;font-weight:700;line-height:1.1}
.opt small{font-weight:600;font-size:11px}
.opt:active{filter:brightness(.92)}
/* Formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{background:var(--fill);border:0;border-radius:10px;padding:10px 12px;min-height:44px;width:100%;color:var(--ink);font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--us);outline-offset:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.rmpask{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.prow{display:grid;grid-template-columns:42px 72px 1fr 150px 40px;gap:8px;align-items:center}
@media (max-width:560px){.prow{grid-template-columns:42px 52px 1fr 40px;gap:6px}.prow select{grid-column:2/4}}
.prow .btn{padding:0;min-height:40px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.checks label{display:flex;gap:8px;align-items:center;background:var(--fill);border-radius:10px;padding:10px 12px;font-size:15px}
.checks input{width:18px;height:18px;accent-color:var(--us)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--fill);border-radius:10px;padding:2px;align-self:flex-start;max-width:100%}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;min-height:34px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Estadísticas */
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px}
@media (min-width:640px){.figs{grid-template-columns:repeat(4,1fr)}}
.fig{display:flex;flex-direction:column;gap:2px}
.fig .k{font-size:13px;color:var(--muted);font-weight:500}
.fig .v{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.fig .s{font-size:12px;color:var(--muted)}
.fig.us .v{color:var(--us)} .fig.them .v{color:var(--them)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;font-size:15px}
.bar .t{height:10px;background:var(--fill);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--bad);border-radius:99px}
.bar .n{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:420px){.bar{grid-template-columns:110px 1fr 26px;font-size:14px}}
.tablebox{overflow-x:auto;margin:0;padding:0}
table.st{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.st th,.st td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--sep)}
.st th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.st thead tr:first-child th{text-align:center;color:var(--ink);font-size:12px;border-bottom:0;padding-bottom:0}
.st th.l,.st td.l{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
.st td.grp,.st th.grp{padding-left:14px}
.st tbody tr:last-child td{border-bottom:0}
.st tr.tot td{font-weight:700}
.st .num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--us-tint);color:var(--us);align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:4px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--sep);stroke-width:1} .chart .zero{stroke:var(--fill-2);stroke-width:1.5}
.chart .lu{fill:none;stroke:var(--us);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font)}
.chart text.h.us{fill:var(--us)} .chart text.h.them{fill:var(--them)}
/* Historial */
.mlist{display:flex;flex-direction:column}
.mitem{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--sep)}
.mitem:last-child{border-bottom:0}
.mitem .res{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:52px}
.mitem .res.w{color:var(--us)} .mitem .res.l{color:var(--them)}
@media (max-width:600px){.mitem{grid-template-columns:auto 1fr}.mitem .acts{grid-column:1/-1}}
/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--sep);display:grid;grid-template-columns:repeat(4,1fr);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:transparent;padding:6px 4px;font-weight:500;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--us)}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty .hand{margin:0}
.empty ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.toast{pointer-events:none}.toast .tact{pointer-events:auto}
body:has(#sheet) .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
.cl{display:inline-block;max-width:min(160px,34vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.toast .tact{margin-left:12px;border:0;background:none;color:var(--ball);font-weight:700;font-size:14px;padding:4px 2px;min-height:32px}
#savefail{position:sticky;top:0;z-index:30}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
/* Fase 0: log editable, avisos, n junto a los % */
.note.warn{box-shadow:inset 0 0 0 2px var(--bad)}
#vidbox{position:sticky;top:0;z-index:20;max-width:820px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--bg);display:flex;flex-direction:column;gap:6px}
#vidbox[hidden]{display:none}
#vidbox video{width:100%;max-height:38vh;background:#000;border-radius:var(--r-sm)}
#vidbox .vctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.seek{border:0;background:var(--fill);color:var(--us);border-radius:99px;font-size:12px;font-weight:700;padding:4px 8px;min-height:32px;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .n{font:700 34px/1 var(--font-num);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.stepper .btn{min-width:52px;font-size:22px}
.gapgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#imgbox{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#imgbox .card{background:var(--bg);border-radius:var(--r);padding:14px;max-width:560px;width:100%;max-height:94%;overflow:auto;display:flex;flex-direction:column;gap:10px}

.note.warn .hand{color:var(--bad)}
.feed li .lbl{flex:1;min-width:0}

<script>
(function(){
"use strict";
/* ---------- Modelo ---------- */
const POS={COL:"Colocador",OPU:"Opuesto",REC:"Receptor",CEN:"Central",LIB:"Líbero",UNI:"Universal"};
/* Fundamentos y evaluaciones. Quién gana el rally lo dice la tabla de resultados (configurable), no esta lista. */
const FUND={
  S:{n:"Saque",o:[["#","Ace"],["+","Positivo"],["!","En juego"],["=","Error"]]},
  R:{n:"Recepción",o:[["#","Perfecta"],["+","Positiva"],["-","Negativa"],["=","Error"]]},
  A:{n:"Ataque",o:[["#","Punto"],["+","En juego"],["/","Bloqueado"],["=","Error"]]},
  B:{n:"Bloqueo",o:[["#","Punto"],["+","Toque"],["=","Error"]]},
  D:{n:"Defensa",o:[["#","Perfecta"],["+","Levantada"],["=","Error"]]},
  E:{n:"Colocación",o:[["#","Perfecta"],["+","Buena"],["=","Error"]]},
  X:{n:"Falta",o:[["r","Red / invasión"],["d","Dobles / retención"],["p","Pisada / rotación"],["o","Otra falta"]]}
};
const ACT="SRAEBDX";
const BASE_ORDER=["S","R","A","B","D","E","X"];
const DEFAULT_TABLE={S:{"#":"us","=":"them"},R:{"=":"them"},A:{"#":"us","/":"them","=":"them"},B:{"#":"us","=":"them"},D:{"=":"them"},E:{"=":"them"},X:{r:"them",d:"them",p:"them",o:"them"}};
const TEAMF={RE:"Error del rival",RP:"Punto del rival",T:"Tiempo muerto"};
const LS_KEY="libreta-voley-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const pct=(a,b)=>b?Math.round(a*100/b)+"%":"–";
/* Porcentaje con el número de acciones al lado; con menos de 3 acciones sale atenuado */
const pctN=(a,b)=>b?`<span class="${b<3?"low":""}" title="${a} de ${b}">${Math.round(a*100/b)}%<span class="nn">${b}</span></span>`:"–";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fdate=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||"")))return"";const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
/* Limpieza de lo que llega de fuera (copias, partidos recibidos, cuenta): ids solo con letras y números, números como números */
const sid=v=>v==null||v===""?v:String(v).replace(/[^A-Za-z0-9_-]/g,"");
const snum=v=>{const n=+v;return isFinite(n)?n:0};
function cleanPlayers(arr){return(Array.isArray(arr)?arr:[]).filter(p=>p&&typeof p==="object").map(p=>({...p,id:sid(p.id)||newId(),num:snum(p.num),name:String(p.name==null?"":p.name),pos:POS[p.pos]?p.pos:"REC"}))}
function cleanMatch(m){if(m.id!=null)m.id=sid(m.id);if(m.date!=null&&!/^\d{4}-\d{2}-\d{2}$/.test(String(m.date)))m.date="";
  if(m.bestOf!=null)m.bestOf=[1,3,5].includes(+m.bestOf)?+m.bestOf:5;["pts","tie"].forEach(k=>{if(m[k]!=null){const n=+m[k];m[k]=n>=1&&n<=99?n:(k==="pts"?25:15)}});if(m.maxSubs!=null)m.maxSubs=snum(m.maxSubs)||6;
  m.rival=String(m.rival==null?"":m.rival);if(m.comp!=null)m.comp=String(m.comp);if(m.video)m.video={name:String(m.video.name||"")};
  m.players=cleanPlayers(m.players);if(Array.isArray(m.roster))m.roster=m.roster.map(sid);
  const cz=o=>{["id","ref","p","pin","pout","p1"].forEach(k=>{if(o[k]!=null)o[k]=sid(o[k])});["us","them","vt"].forEach(k=>{if(o[k]!=null)o[k]=snum(o[k])});
    ["z","zo"].forEach(k=>{if(o[k]!=null){const n=+o[k];if(n>=1&&n<=9&&Number.isInteger(n))o[k]=n;else o[k]=null}});if(o.r!=null)o.r=String(o.r).slice(0,2);if(o.f!=null)o.f=String(o.f).slice(0,4)};
  m.sets.forEach(st=>{if(st.lineup&&typeof st.lineup==="object"){st.lineup.p=(st.lineup.p||[]).map(sid);st.lineup.setter=sid(st.lineup.setter);st.lineup.libs=(st.lineup.libs||[]).map(sid)}
    st.log=st.log.filter(x=>x&&typeof x==="object");st.log.forEach(x=>{cz(x);if(x.k==="edit"&&x.set&&typeof x.set==="object")cz(x.set)})});return m}
function rclass(f,r,T){const w=T&&T[f]&&T[f][r];if(f==="X"||w==="them")return"r-bad";if(w==="us"||r==="#")return"r-good";if(r==="-")return"r-mid";return"r-neu"}
const optLabel=(f,r)=>{const o=FUND[f]&&FUND[f].o.find(x=>x[0]===r);return o?o[1]:r};

const freshState=()=>({team:{name:"Mi equipo",players:[],table:clone(DEFAULT_TABLE),updatedAt:0},matches:{},deleted:{}});
let S=freshState();
const ui={view:"live",liveId:null,sheet:null,statsId:null,statsSet:"all",confirmDel:null,newForm:null,toast:null,logOpen:false,logSet:null};

/* ---------- Formato de los partidos y migración ----------
   v1 (anterior): m.sets=[{first}], m.events=[{s,p,f,r,pt,us,them,sv,...}] con el marcador guardado en cada jugada.
   v2: cada set lleva su propio log append-only: m.sets=[{first,lineup,log:[...]}].
       Entradas del log: {k:"ev",id,t,f,...} (jugada), {k:"del",id,t,ref} (quita una jugada), {k:"edit",id,t,ref,set:{...}} (la corrige).
       Marcador, saque, fin de set y estadísticas salen siempre de replay(). */
function normalizeMatch(m){
  if(!m||typeof m!=="object")return m;
  if(m.v===2&&Array.isArray(m.sets)){m.sets.forEach(s=>{if(!Array.isArray(s.log))s.log=[];if(s.lineup===undefined)s.lineup=null});if(!m.table)m.table=clone(DEFAULT_TABLE);return cleanMatch(m)}
  const sets=(m.sets&&m.sets.length?m.sets:[{first:"us"}]).map(s=>({first:s.first==="them"?"them":"us",lineup:null,log:[]}));
  for(const e of(m.events||[])){
    const si=Math.max(0,Math.min(sets.length-1,+e.s||0));
    const x={k:"ev",id:e.id||newId(),t:e.t||m.updatedAt||0,f:e.f,p:e.p==null?null:e.p};
    if(e.r!=null)x.r=e.r;if(e.n)x.n=e.n;if(e.side)x.side=e.side;
    if(e.f==="X"&&x.n){const o=FUND.X.o.find(o=>o[1]===x.n);if(o)x.r=o[0]}
    sets[si].log.push(x);
  }
  m.sets=sets;delete m.events;m.v=2;m.table=clone(DEFAULT_TABLE);if(!m.maxSubs)m.maxSubs=6;
  return cleanMatch(m);
}
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);if(d&&d.team){
  if(Object.values(d.matches||{}).some(m=>m&&m.v!==2)){try{if(!localStorage.getItem(LS_KEY+"-copia-v1"))localStorage.setItem(LS_KEY+"-copia-v1",raw)}catch(e){}}
  S=Object.assign(S,d);if(!S.team.table)S.team.table=clone(DEFAULT_TABLE);for(const k in S.matches)normalizeMatch(S.matches[k]);return true}}}catch(e){}return false}
/* Guarda en el dispositivo. Si falla (almacenamiento lleno o bloqueado) lo dice y no se calla: ui.saveFail pinta un aviso fijo */
function saveLocal(){let ok=true;try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){ok=false}
  if(ok!==!ui.saveFail){ui.saveFail=!ok;const el=$("#savefail");if(el&&ok)el.remove();if(!ok&&$("#app")&&!el)render()}return ok}

/* ---------- Motor: log → estado ---------- */
/* Aplica las correcciones (del/edit) y devuelve las jugadas vigentes del set, en orden */
function effective(set){const out=[],idx={};
  /* {k:"undo",ref} anula una corrección (del/edit) anterior: así «Deshacer» devuelve una jugada borrada o quita una corrección sin borrar nada */
  const undone=new Set();for(const x of set.log)if(x.k==="undo")undone.add(x.ref);
  for(const x of set.log){
    if(x.k==="undo"||undone.has(x.id))continue;
    if(x.k==="del"){const i=idx[x.ref];if(i!=null)out[i]=null}
    else if(x.k==="edit"){const i=idx[x.ref];if(i!=null&&out[i])out[i]=Object.assign({},out[i],x.set)}
    else{idx[x.id]=out.length;out.push(Object.assign({},x))}}
  return out.filter(Boolean)}
function outcome(T,e){if(e.f==="RE")return"us";if(e.f==="RP")return"them";const t=T[e.f];return t&&t[e.r]||null}
function pmap(m){const o={};(m.players||[]).forEach(p=>o[p.id]=p);return o}
function pname(P,id){const p=P[id];return p?"#"+p.num+" "+p.name:"un jugador que ya no está"}

/* replay: la única función que calcula el estado. ctx[id] = foto del contexto de cada jugada. */
/* Rotación = posición (1-6) del colocador. rot[0] es P1 … rot[5] es P6. */
const BACK=[0,4,5];
function validLineup(L){return!!(L&&Array.isArray(L.p)&&L.p.length===6&&L.p.every(Boolean)&&new Set(L.p).size===6)}
function rotN(st){return st.rot&&st.setter&&st.rot.includes(st.setter)?st.rot.indexOf(st.setter)+1:null}
/* Quién está de verdad en pista: el líbero entra por el central de zaguera, salvo cuando ese central saca */
function courtOf(P,st){if(!st.rot)return null;const c=st.rot.slice();let libAt=-1;
  if(st.lib){const i=BACK.find(i=>{const p=P[c[i]];return p&&p.pos==="CEN"&&!(i===0&&st.serving==="us")});if(i!=null){libAt=i;c[i]=st.lib}}
  return{c,libAt,out:libAt>=0?st.rot[libAt]:null}}
/* Normas FIVB de cambios. Devuelve avisos; nunca bloquea. */
function subIssues(P,st,e,max){const out=[],nm=id=>pname(P,id);
  if(!st.rot){out.push("Este set no tiene alineación: el cambio no se puede comprobar");return out}
  if(!e.pout||!e.pin){out.push("Falta saber quién sale o quién entra");return out}
  if(!st.rot.includes(e.pout))out.push(`${nm(e.pout)} no está en pista`);
  if(st.rot.includes(e.pin))out.push(`${nm(e.pin)} ya está en pista`);
  if(st.libs.includes(e.pin)||st.libs.includes(e.pout))out.push("El líbero no entra ni sale con un cambio normal");
  if(st.subs+1>max)out.push(`Es el cambio ${st.subs+1} del set: el máximo son ${max}`);
  if(st.closed.has(e.pout))out.push(`${nm(e.pout)} ya hizo su salida y su vuelta en este set`);
  else if(st.closed.has(e.pin))out.push(`${nm(e.pin)} ya entró y salió en este set`);
  else{const po=st.pair[e.pout],pi=st.pair[e.pin];
    if(po&&po!==e.pin)out.push(`${nm(e.pout)} solo puede cambiarse por ${nm(po)}`);
    if(pi&&pi!==e.pout)out.push(`${nm(e.pin)} solo puede volver por ${nm(pi)}`);
    if(!po&&!pi&&!st.starters.has(e.pout)&&st.rot.includes(e.pout))out.push(`${nm(e.pout)} no era titular: solo puede salir por quien sustituyó`)}
  return out}
function applySub(st,e){const i=st.rot?st.rot.indexOf(e.pout):-1;if(i<0)return;st.rot[i]=e.pin;if(st.setter===e.pout)st.setter=e.pin;st.subs++;
  const po=st.pair[e.pout];if(po&&po===e.pin){st.closed.add(e.pout);st.closed.add(e.pin)}else if(!po&&!st.pair[e.pin]){st.pair[e.pout]=e.pin;st.pair[e.pin]=e.pout}}
function replay(m){
  const P=pmap(m),T=m.table||DEFAULT_TABLE,ctx={},issues=[],sets=[];let wonUs=0,wonThem=0;const need=Math.ceil(m.bestOf/2);const max=m.maxSubs||6;
  m.sets.forEach((set,si)=>{
    const tgt=si===m.bestOf-1?m.tie:m.pts;const L=validLineup(set.lineup)?set.lineup:null;
    const st={first:set.first,us:0,them:0,serving:set.first,to:{us:0,them:0},done:false,winner:null,rally:1,rallies:[],evs:[],issues:[],
      lineup:L,rot:L?L.p.slice():null,setter:L&&L.p.includes(L.setter)?L.setter:null,libs:L?(L.libs||[]).filter(id=>id&&!L.p.includes(id)).slice(0,2):[],lib:null,
      subs:0,pair:{},closed:new Set(),starters:new Set(L?L.p:[]),gap:0};
    st.lib=st.libs[0]||null;
    let cur=null;const onCourt=()=>{const c=courtOf(P,st);return c?c.c.slice():null};
    const newRally=()=>({n:st.rally,sv:st.serving,rot:rotN(st),court:onCourt(),us:st.us,them:st.them,evs:[],win:null,recQ:null,trans:false,atk:0});cur=newRally();
    const iss=(e,msg)=>{const x={set:si,rally:cur.n,evId:e?e.id:null,msg};st.issues.push(x);issues.push(x)};
    let extra=false;
    for(const e of effective(set)){

/* ---------- Directo de solo lectura ----------
   El entrenador comparte un código; quien lo tiene ve el marcador, las jugadas y las cifras desde su móvil, sin poder cambiar nada.
   Se guarda en live/<id del entrenador> cifrado con AES-GCM: la clave va solo en el código, así que la base de datos (y quien la liste) solo ve texto cifrado.
   Salen los dorsales; los nombres solo si el entrenador lo elige. Caduca a las 12 horas y se borra al parar. */

async function unseal(d,key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u.dec(d.iv)},await aesKey(b64u.dec(key),"decrypt"),b64u.dec(d.ct));return JSON.parse(new TextDecoder().decode(pt))}

function liveSnapshot(m){const r=replay(m),T=m.table||DEFAULT_TABLE,names=!!share.names;
  const P={};(m.players||[]).forEach(p=>P[p.id]={...p,name:names?String(p.name||"").trim():""});
  const who=p=>p?("#"+p.num+(p.name?" "+p.name:"")):"";
  const st=computeStats(gather([m],"all")),t=st.team;const all=[];r.sets.forEach(x=>x.evs.forEach(e=>all.push(e)));
  const plays=all.filter(e=>!(r.ctx[e.id]||{}).extra).slice(-12).reverse().map(e=>{const c=r.ctx[e.id]||{};const[sym,cls]=evSym(e,T);
    return{sc:e.f==="GAP"?e.us+"-"+e.them:(c.us+(c.win==="us"?1:0))+"-"+(c.them+(c.win==="them"?1:0)),sym,cls,txt:evLabel(e,P).replace(/\s+·/g," ·").replace(/\s+$/,"")}});
  const rows=st.rows.filter(x=>x.pid&&(x.pts||x.err||x.S.t||x.R.t||x.A.t||x.B.t||x.D.t)).map(x=>({n:who(P[x.pid]||x.p),pts:x.pts,err:x.err,ace:x.S["#"],atk:x.A.t?x.A["#"]+"/"+x.A.t:"–",blk:x.B["#"],rec:x.R.t?Math.round((x.R["#"]+x.R["+"])*100/x.R.t)+"%":"–"}));
  return{v:1,team:S.team.name,rival:m.rival,date:m.date,comp:m.comp||"",set:r.ci+1,cur:[r.cur.us,r.cur.them],sv:r.serving,won:[r.wonUs,r.wonThem],fin:r.finished,
    sets:r.sets.filter(x=>x.us+x.them).map(x=>[x.us,x.them,x.done?x.winner:null]),so:[t.soW,t.soT],br:[t.brW,t.brT],plays,rows,names,t:Date.now()}}
function livePush(now){if(!share)return;clearTimeout(shareT);if(!now){shareT=setTimeout(()=>livePush(true),1200);return}
  (async()=>{const m=S.matches[share.mid];if(!m||!db){shareErr=db?"gone":"nodb";paintShare();return}
    try{const body=await seal(liveSnapshot(m),share.key);await db.doc("live/"+share.uid).set({v:1,iv:body.iv,ct:body.ct,exp:Date.now()+LIVE_H*3600e3,t:Date.now()});shareErr=null;shareAt=Date.now()}
    catch(e){shareErr=e&&(e.code==="invalid_argument"||e.code==="permission_denied")?"ro":"net"}paintShare()})()}
const NEED_ACC=()=>"entra en tu cuenta (pestaña Equipo)";

  if(share&&share.uid!==uid)await liveStop(true);
  share={mid:m.id,uid:sid(uid),key:b64u.enc(crypto.getRandomValues(new Uint8Array(16))),names:false,since:Date.now()};shareSave();shareErr=null;render();livePush(true)}
async function liveStop(quiet){const x=share;share=null;shareSave();clearTimeout(shareT);if(db&&x)try{await db.doc("live/"+x.uid).delete()}catch(e){}if(!quiet){render();toast("Directo parado: el código ya no sirve")}}

/* Seguir un directo con un código */
let fol={code:"",unsub:null,data:null,err:null,at:0};
async function follow(code){code=String(code||"").trim().replace(/\s+/g,"");const i=code.lastIndexOf(".");
  if(fol.unsub){try{fol.unsub()}catch(e){}fol.unsub=null}
  fol={code,unsub:null,data:null,err:null,at:0};try{localStorage.setItem(LIVE_KEY+"-sigo",code)}catch(e){}
  const uid=sid(code.slice(0,i)),key=code.slice(i+1);
  if(i<1||!uid||!/^[A-Za-z0-9_-]{20,}$/.test(key)){fol.err="code";render();return}
  const d=fbDb;
  render();
  fol.unsub=d.doc("live/"+uid).onSnapshot(async snap=>{const x=snap.exists?snap.data():null;
    if(!x||!x.ct||(x.exp&&x.exp<Date.now())){fol.data=null;fol.err="ended";if(ui.view==="follow")render();return}
    try{fol.data=await unseal(x,key);fol.err=null;fol.at=x.t||Date.now()}catch(e){fol.data=null;fol.err="key"}if(ui.view==="follow")render()},
    e=>{fol.err="net";if(ui.view==="follow")render()})}
function unfollow(){if(fol.unsub){try{fol.unsub()}catch(e){}}fol={code:"",unsub:null,data:null,err:null,at:0};try{localStorage.removeItem(LIVE_KEY+"-sigo")}catch(e){}}

  const form=`<div class="zone"><h2>Seguir un partido en directo</h2><p class="muted small" style="margin:0">Pega el código que te ha pasado el entrenador o quien apunta. Solo se puede mirar: nada de lo que hagas aquí cambia el partido.</p>

  if(!d)return form+`<div class="note${fol.err?" warn":""}"><p class="hand">${fol.err?esc(msg[fol.err]):"Conectando con el directo…"}</p></div>`;
  const ago=Math.max(0,Math.round((Date.now()-fol.at)/1000));

  <div class="score" role="group" aria-label="Marcador en directo, set ${d.set}">
    <div class="t us"><span class="tn">${esc(d.team)}</span><span class="n">${d.cur[0]}</span><span class="srv ${d.sv==="us"&&!d.fin?"on":""}">Saque</span><span class="ts">Sets ${d.won[0]}</span></div>

  const line=(s,l,cls)=>{const S_=s.S,R=s.R,A=s.A;return`<tr class="${cls||""}"><td class="l">${l}</td>${st.hasCourt?`<td>${s.on?(s.pm>0?"+":"")+s.pm:"–"}</td>`:""}<td>${s.pts}</td><td>${s.err}</td><td class="g">${S_.t}</td><td>${S_["#"]}</td><td>${S_["="]}</td><td>${eff(S_["#"]+S_["+"]+S_["/"]-S_["="]-S_["-"],S_.t)}</td><td class="g">${R.t}</td><td>${pctN(R["#"]+R["+"],R.t)}</td><td>${pctN(R["#"],R.t)}</td><td>${R["="]}</td><td class="g">${A.t}</td><td>${A["#"]}</td><td>${A["="]}</td><td>${A["/"]}</td><td>${pctN(A["#"],A.t)}</td><td>${eff(A["#"]-A["="]-A["/"],A.t)}</td><td class="g">${s.B["#"]}</td><td>${s.D.t}</td><td>${s.X.t}</td></tr>`};

const BK_KEY=LS_KEY+"-ultima-copia";

function backupText(){return JSON.stringify({app:"empat-data",v:2,savedAt:Date.now(),team:S.team,matches:Object.fromEntries(Object.entries(S.matches).filter(([k,m])=>!m.example))},null,1)}
/* Lee una copia y cuenta qué haría, sin tocar nada */
function parseBackup(txt){let d;try{d=JSON.parse(txt)}catch(e){return{err:"El texto no es una copia de emPat Data"}}
  if(!d||typeof d!=="object"||!d.team||!d.matches||typeof d.matches!=="object")return{err:"El fichero no es una copia de emPat Data"};
  d.team.players=cleanPlayers(d.team.players);
  const mk={},clash={},local=pmap({players:S.team.players});let add=0,upd=0,same=0,back=0,byNum=0;
  for(const k in d.matches){const rm=normalizeMatch(clone(d.matches[k]));if(!rm||!Array.isArray(rm.sets))continue;const key=sid(rm.id||k)||newId();rm.id=key;
    const mp=numMap(rm.players);byNum=Math.max(byNum,Object.keys(mp).length);
    /* mismo dorsal y otro nombre: se une igualmente, pero se avisa */
    (rm.players||[]).forEach(p=>{const to=mp[p.id];if(to&&local[to]&&compKey(local[to].name)!==compKey(p.name))clash[p.num]=`#${p.num} ${p.name} del fichero se une a tu #${local[to].num} ${local[to].name}`});
    remapIds(rm,mp);mk[key]=rm;const loc=S.matches[key];
    if(!loc){add++;if(S.deleted[key])back++}else if(sameMatch(mergeMatch(loc,rm),loc))same++;else upd++}
  d.matches=mk;
  const known=new Set(S.team.players.map(p=>p.id)),nums=new Set(S.team.players.map(p=>+p.num));
  const newPl=(d.team.players||[]).filter(p=>!known.has(p.id)&&!nums.has(+p.num));
  /* La tabla «Qué cierra cada jugada» viene con una copia completa; solo se trae si aquí sigue la de por defecto */
  const tbl=d.kind!=="partido"&&d.team.table&&typeof d.team.table==="object"&&JSON.stringify(S.team.table||DEFAULT_TABLE)===JSON.stringify(DEFAULT_TABLE)&&JSON.stringify(d.team.table)!==JSON.stringify(DEFAULT_TABLE);
  return{d,add,upd,same,back,byNum,newPl:newPl.length,kind:d.kind,clash:Object.values(clash),tbl}}
function applyBackup(rs){const d=rs.d;
  for(const k in d.matches){const loc=S.matches[k];const mg=mergeMatch(loc,d.matches[k]);mg.example=false;
    if(loc&&sameMatch(mg,loc))continue;
    /* sin tocar la fecha de modificación: la fusión ya se queda con la más reciente de las dos copias */
    delete S.deleted[k];mg.status=replay(mg).finished?"done":"live";S.matches[k]=mg;markDirty("m_"+k)}
  const known=new Set(S.team.players.map(p=>p.id)),nums=new Set(S.team.players.map(p=>+p.num));
  (d.team.players||[]).forEach(p=>{if(!known.has(p.id)&&!nums.has(+p.num)){S.team.players.push(clone(p));nums.add(+p.num)}});
  if(rs.tbl)S.team.table=clone(d.team.table);
  if(S.team.name==="Mi equipo"&&d.team.name)S.team.name=String(d.team.name);teamChanged();
  const cur=S.matches[ui.liveId];if(!cur||cur.status!=="live")pickLive()}

  r.sets.forEach(st=>st.evs.forEach(e=>{const c=r.ctx[e.id];if(!e.p||!c.win||c.extra)return;if(c.win==="us")pts[e.p]=(pts[e.p]||0)+1;else errs[e.p]=(errs[e.p]||0)+1}));
  const roster=m.roster||(m.players||[]).map(x=>x.id);

    <div class="row">${m.example?`<span class="tag ex">ejemplo</span>`:""}<button class="btn sm" data-act="detail" title="Cambiar el nivel de detalle" aria-label="Modo ${isQuick(m)?"rápido":"completo"}: cambiar">${isQuick(m)?"⚡ Rápido":"Completo"}</button>${m.example?"":`<button class="btn sm" data-act="zones" aria-pressed="${!!m.zones}" title="Apuntar hacia dónde van saques y ataques">${m.zones?"Zonas ✓":"Zonas"}</button>`}<button class="btn sm" data-act="new">Nuevo partido</button></div></div>
  <div class="score" role="group" aria-label="Marcador, set ${ci+1}">
    <div class="t us"><span class="tn">${esc(ourName)}</span><span class="n">${cur.us}</span><span class="srv ${r.serving==="us"&&!lock?"on":""}">Saque</span><span class="ts">Sets ${r.wonUs} · Tiempos ${cur.to.us}/2</span></div>
    <div class="mid"><span class="colon">:</span><span class="setn">Set ${ci+1}</span>${cur.rotN?`<span class="rotn" title="Rotación: el colocador está en P${cur.rotN}">Rot. ${cur.rotN}</span>`:""}</div>
    <div class="t them"><span class="tn">${esc(m.rival)}</span><span class="n">${cur.them}</span><span class="srv ${r.serving==="them"&&!lock?"on":""}">Saque</span><span class="ts">Sets ${r.wonThem} · Tiempos ${cur.to.them}/2</span></div>
  </div>
  <div class="setline">${setChips(r,true)}</div>
  ${note}${warn}
  ${cur.court?serveRow(m,r,P,lock)+courtZone(m,r,P,pts,errs,lock,players):`<div class="zone"><div class="row spread"><p class="hand">Toca un jugador</p><span class="muted small">${lock?"":r.serving==="us"?"Sacamos nosotros: empieza por el saque":"Saca el rival: empieza por la recepción"}</span></div>
    ${lock?"":`<div class="row spread" style="background:var(--fill);border-radius:var(--r-sm);padding:10px 12px"><span class="small">Sin alineación en este set: no se cuentan rotaciones.</span><button class="btn sm" data-act="lineup" data-si="${ci}">Poner alineación</button></div>`}
    ${isQuick(m)?teamBar(m,r,lock):""}

      <button class="jsy later" data-act="player" data-id="" ${lock?"disabled":""}>${jersey(null)}<span class="nm">Sin jugador</span><span class="tally">Asignar después</span></button></div>

  ${pend.length?`<div class="zone"><div class="row spread"><p class="hand">Pendientes de asignar · ${pend.length}</p><span class="muted small">Para el tiempo muerto</span></div><ul class="pend">${pend.map(({e,si})=>{const c=r.ctx[e.id];return`<li><span class="code ${rclass(e.f,e.r,m.table)}">${esc(e.r)}</span><span style="flex:1">${esc(FUND[e.f].n+" "+optLabel(e.f,e.r).toLowerCase())} <span class="muted small">· set ${si+1}, ${c.us}-${c.them}</span></span><button class="btn sm" data-act="edit" data-ref="${e.id}" data-si="${si}">Asignar</button></li>`}).join("")}</ul></div>`:""}
  <div class="zone"><div class="row spread"><p class="hand">Últimas jugadas <span class="small" style="text-transform:none;letter-spacing:0">· ${nn(cur.us+cur.them,"punto","puntos")} en este set${cur.gap?`, ${cur.gap} sin apuntar`:""}</span></p><div class="row"><button class="btn sm" data-act="showlog" data-si="${ci}">${ui.logOpen?"Ocultar el set":"Todo el set"}</button><button class="btn sm" data-act="undo" ${canUndo?"":"disabled"}>↶ Deshacer</button></div></div>
    ${ui.logOpen?viewLog(m,r):feed?`<ul class="feed">${feed}</ul>`:`<p class="muted">Aún no hay jugadas. Toca un jugador para apuntar la primera.</p>`}
    <div class="codes"><span><b>#</b> perfecto o punto</span><span><b>+</b> positivo</span><span><b>!</b> en juego</span><span><b>−</b> negativo</span><span><b>/</b> bloqueado</span><span><b>=</b> error</span><span>Toca el lápiz para corregir cualquier jugada</span></div></div>
  ${m.example?"":videoZone(m)}
  ${shareZone(m)}`;
}
function teamBar(m,r,lock){const cur=r.cur;const d=lock?"disabled":"";
  return`<div class="quick">
      <button class="qbtn us" data-act="team" data-f="RE" ${d}>Error del rival<small>+1 para nosotros</small></button>
      <button class="qbtn them" data-act="team" data-f="RP" ${d}>Punto del rival<small>+1 para ellos, sin fallo nuestro</small></button>
      <button class="qbtn them" data-act="fault" ${d}>Falta nuestra<small>red, dobles, rotación…</small></button>
      <button class="qbtn" data-act="gap" ${d}>Me he perdido puntos<small>pon el marcador de ahora</small></button>
      <button class="qbtn" data-act="to" data-side="us" ${lock||cur.to.us>=2?"disabled":""}>Tiempo nuestro<small>${cur.to.us} de 2</small></button>
      <button class="qbtn" data-act="to" data-side="them" ${lock||cur.to.them>=2?"disabled":""}>Tiempo rival<small>${cur.to.them} de 2</small></button>
      ${cur.court?`<button class="qbtn" data-act="sub" ${d}>Cambio<small>${cur.subs} de ${m.maxSubs||6} en este set</small></button>`:""}
      ${cur.court&&cur.libs.length>1?`<button class="qbtn lib" data-act="libswap" ${d}>Cambiar líbero<small>entra #${esc((pmap(m)[cur.libs.find(x=>x!==cur.lib)]||{}).num)}</small></button>`:""}
    </div>`}
/* Fila de saque: el sacador (P1) ya se sabe, así que basta un toque */
function serveRow(m,r,P,lock){const st=r.cur;if(lock||r.serving!=="us"||!st.rot||(st.curRally&&st.curRally.evs.length))return"";
  const p=P[st.rot[0]];if(!p)return"";const T=m.table||DEFAULT_TABLE;
  const q=isQuick(m);
  return`<div class="zone serve"><div class="row spread"><div class="row" style="gap:10px">${jersey(p)}<div><p class="hand us" style="margin:0">Saca #${esc(p.num)} ${esc(p.name)}</p><span class="muted small">${q?"Solo si el rally acaba en el saque":"Un toque y listo"}</span></div></div></div>
    ${m.zones?`<div class="zpick"><div><span class="zl">Hacia (opcional, antes de la evaluación)</span>${zgrid("qz",ui.qz)}</div></div>`:""}
    <div class="opts">${(q?closing(T,"S"):FUND.S.o).map(o=>{const w=T.S&&T.S[o[0]];return`<button class="opt ${rclass("S",o[0],T)}" data-act="qserve" data-r="${esc(o[0])}"><b>${esc(o[0])}</b>${esc(o[1])}${w?`<small>${w==="us"?"+1 nosotros":"+1 rival"}</small>`:""}</button>`}).join("")}</div></div>`}
/* La pista: delante 4-3-2, detrás 5-6-1, con el líbero ya colocado */
function courtZone(m,r,P,pts,errs,lock,players){const st=r.cur,ct=st.court,d=lock?"disabled":"";
  const tile=i=>{const id=ct.c[i],p=P[id],srv=i===0&&r.serving==="us"&&!lock,isL=st.libs.includes(id);
    return`<button class="cpos${srv?" srvp":""}${isL?" islib":""}" data-act="player" data-id="${id}" ${d} aria-label="Zona ${i+1}: ${p?"dorsal "+p.num+", "+esc(p.name):"vacía"}"><span class="z">${i+1}</span>${srv?`<span class="flag">Saca</span>`:id===st.setter?`<span class="flag set">Col.</span>`:isL?`<span class="flag lib">Líb.</span>`:""}${jersey(p,false,isL)}<span class="nm">${esc(p?p.name:"?")}</span><span class="tally"><b>${pts[id]||0}</b> · <em>${errs[id]||0}</em></span></button>`};
  const onCourt=new Set(ct.c);const bench=players.filter(p=>!onCourt.has(p.id)&&!st.rot.includes(p.id)&&!st.libs.includes(p.id));
  const libTxt=st.lib?(ct.libAt>=0?`Líbero #${esc(P[st.lib].num)} por #${esc((P[ct.out]||{}).num)}`:`Líbero #${esc(P[st.lib].num)} fuera: saca el central`):"";
  return`<div class="zone"><div class="row spread"><p class="hand">${lock?"En pista":r.serving==="us"?"Sacamos nosotros":"Saca el rival: empieza por la recepción"}</p><div class="row" style="gap:8px"><span class="muted small">${st.rotN?"Rotación "+st.rotN:""}${libTxt?" · "+libTxt:""}</span><button class="btn sm" data-act="lineup" data-si="${r.ci}">Alineación</button></div></div>
    ${isQuick(m)?teamBar(m,r,lock):""}
    <div class="court"><div class="net" aria-hidden="true"><span>Red</span></div><div class="cgrid">${[3,2,1,4,5,0].map(tile).join("")}</div></div>
    <div class="row"><button class="btn sm" data-act="player" data-id="" ${d}>? Sin jugador · asignar después</button></div>
    ${bench.length?`<div class="benchline"><span class="muted small">Banquillo</span>${bench.map(p=>`<button class="pchip" data-act="sub" data-in="${p.id}" ${d} aria-label="Cambio: entra ${esc(p.name)}">#${esc(p.num)} ${esc(p.name)}</button>`).join("")}</div>`:""}
    ${isQuick(m)?"":teamBar(m,r,lock)}</div>`}
/* Log completo de un set, agrupado por rally */
function viewLog(m,r){const P=pmap(m);const si=ui.logSet==null||ui.logSet>=r.sets.length?r.ci:ui.logSet;const st=r.sets[si];
  const seg=r.sets.length>1?`<div class="seg" role="group" aria-label="Set del log">${r.sets.map((_,i)=>`<button data-act="logset" data-v="${i}" aria-pressed="${i===si}">Set ${i+1}</button>`).join("")}</div>`:"";
  const groups=[];let g=null;for(const e of st.evs){const c=r.ctx[e.id];const key=c.extra?"x":c.rally;if(!g||g.key!==key){g={key,c,evs:[]};groups.push(g)}g.evs.push(e)}
  if(!groups.length)return seg+`<p class="muted">Este set aún no tiene jugadas.</p>`;
  const ourName=S.team.name||"Nosotros";
  return seg+`<div class="otab">${groups.reverse().map(g=>{const last=g.evs.map(e=>r.ctx[e.id]).find(c=>c.win);
    return`<div class="rally"><div class="rh"><span>${g.key==="x"?"Después del final del set":`Rally ${g.c.rally} · saca ${g.c.sv==="us"?esc(ourName):esc(m.rival)} · ${g.c.us}-${g.c.them}`}</span>${last?`<span class="${last.win==="us"?"w":"l"}">${last.win==="us"?"Punto nuestro":"Punto rival"}</span>`:""}</div>
    <ul class="feed">${g.evs.slice().reverse().map(e=>feedItem(m,e,r,P)).join("")}</ul></div>`}).join("")}</div>`}

/* ---------- Hoja de acciones ----------
   ui.sheet = {mode:"new"|"fault"|"edit"|"teamedit", p, prev:{f,r}, ref, si} */
function sheetPlayers(m){const roster=m.roster||(m.players||[]).map(x=>x.id);return(m.players||[]).filter(p=>roster.includes(p.id)).sort((a,b)=>a.num-b.num)}
function renderSheet(){
  let el=$("#sheet");if(el)el.remove();const sh=ui.sheet;setInert();if(!sh){vidRelease();backFocus();return}vidHold();
  const m=S.matches[ui.liveId];if(!m){ui.sheet=null;return}
  const P=pmap(m),r=replay(m),T=m.table||DEFAULT_TABLE;
  el=document.createElement("div");el.id="sheet";el.className="sheet-bg";el.dataset.act="close";
  let inner="";
  if(sh.mode==="gap"){const st=r.cur;const diff=(sh.us-st.us)+(sh.them-st.them);const ourName=S.team.name||"Nosotros";
    const gtgt=r.ci===m.bestOf-1?m.tie:m.pts;const ends=Math.max(sh.us,sh.them)>=gtgt&&Math.abs(sh.us-sh.them)>=2;
    const step=(k,lbl)=>`<div class="frow"><span class="fn">${esc(lbl)}</span><div class="stepper"><button class="btn" data-act="gapstep" data-k="${k}" data-d="-1" ${sh[k]<=st[k]?"disabled":""} aria-label="Uno menos">−</button><span class="n" id="gap-${k}">${sh[k]}</span><button class="btn" data-act="gapstep" data-k="${k}" data-d="1" ${sh[k]+1>Math.max(gtgt,sh[k==="us"?"them":"us"]+2)?"disabled":""} aria-label="Uno más">+</button></div></div>`;
    inner=`<header><div><div style="font-weight:700;font-size:20px">Me he perdido puntos</div><div class="muted small">Set ${r.ci+1} · iba ${st.us}-${st.them}. Pon el marcador de ahora.</div></div><button class="btn sm" data-act="close">Cerrar</button></header>
      <div class="gapgrid">${step("us",ourName)}${step("them",m.rival)}</div>
      <div class="frow"><span class="fn">¿Quién saca ahora?</span><div class="seg" role="group"><button data-act="gapsv" data-v="us" aria-pressed="${sh.sv==="us"}">${esc(ourName)}</button><button data-act="gapsv" data-v="them" aria-pressed="${sh.sv==="them"}">${esc(m.rival)}</button></div></div>
      ${st.rot?`<div class="frow"><span class="fn">¿Quién está en P1 (zona de saque)?</span><div class="pchips">${st.rot.map(id=>P[id]).filter(Boolean).map(q=>`<button class="pchip" data-act="gapp1" data-id="${q.id}" aria-pressed="${sh.p1===q.id}">#${esc(q.num)} ${esc(q.name)}</button>`).join("")}<button class="pchip" data-act="gapp1" data-id="" aria-pressed="${!sh.p1}">No lo sé</button></div><span class="muted small">Para que la rotación siga cuadrando. Si no lo sabes, se queda como estaba.</span></div>`:""}
      <p class="muted small" style="margin:0">Esos ${diff>0?diff+" ":""}puntos cuentan en el marcador, pero no en side-out, break, rotaciones ni +/−, porque no se sabe cómo fueron.</p>
      ${ends&&diff>0?`<p class="small" style="margin:0;color:var(--mid);font-weight:600">Con ${sh.us}-${sh.them} el set se acaba.</p>`:""}
      <div class="row"><button class="btn primary" data-act="gapdo" ${diff>0?"":"disabled"}>Poner ${sh.us}-${sh.them}</button></div>`;
  }else if(sh.mode==="sub"){const st=r.cur;if(!st.rot){ui.sheet=null;return}
    const pl=sheetPlayers(m);const benchP=pl.filter(p=>!st.rot.includes(p.id)&&!st.libs.includes(p.id));
    const warns=sh.out&&sh.in?trySub(m,{f:"SUB",pout:sh.out,pin:sh.in}):[];
    const chip=(p,k,sel,extra)=>`<button class="pchip" data-act="subpick" data-k="${k}" data-id="${p.id}" aria-pressed="${sel===p.id}">${extra||""}#${esc(p.num)} ${esc(p.name)}</button>`;
    inner=`<header><div><div style="font-weight:700;font-size:20px">Cambio</div><div class="muted small">Set ${r.ci+1} · ${st.us}-${st.them} · cambios ${st.subs} de ${m.maxSubs||6}</div></div><button class="btn sm" data-act="close">Cerrar</button></header>
      <div class="frow"><span class="fn">Sale</span><div class="pchips">${[0,1,2,3,4,5].map(i=>{const p=P[st.rot[i]];return p?chip(p,"out",sh.out,`P${i+1} · `):""}).join("")}</div>${st.court&&st.court.libAt>=0?`<span class="muted small">El líbero está en pista por #${esc((P[st.court.out]||{}).num)}; el cambio se hace con el central.</span>`:""}</div>
      <div class="frow"><span class="fn">Entra</span><div class="pchips">${benchP.map(p=>chip(p,"in",sh.in)).join("")||`<span class="muted small">No queda nadie en el banquillo.</span>`}</div></div>
      ${warns.length?`<div class="frow" style="box-shadow:inset 0 0 0 2px var(--bad)"><span class="fn" style="color:var(--bad)">Según las normas FIVB</span>${warns.map(w=>`<span class="small">· ${esc(w)}</span>`).join("")}<span class="muted small">Es un aviso: puedes hacer el cambio igualmente.</span></div>`:sh.out&&sh.in?`<div class="frow"><span class="small" style="color:var(--good);font-weight:600">Cambio válido según las normas FIVB</span></div>`:""}
      <div class="row"><button class="btn primary" data-act="subdo" ${sh.out&&sh.in?"":"disabled"}>${warns.length?"Hacer el cambio igualmente":"Hacer el cambio"}</button></div>`;
  }else if(sh.mode==="teamedit"){const e=effective(m.sets[sh.si]).find(x=>x.id===sh.ref);if(!e){ui.sheet=null;return}const c=r.ctx[e.id]||{};
    const opts=e.f==="RE"||e.f==="RP"?[["RE","Error del rival","us"],["RP","Punto del rival","them"]]:[];
    inner=`<header><div><div style="font-weight:700;font-size:20px">Corregir jugada</div><div class="muted small">Set ${sh.si+1} · rally ${c.rally} · ${c.us}-${c.them} · ${esc(evLabel(e,P))}</div></div><button class="btn sm" data-act="close">Cerrar</button></header>

  }else{

    const guess=predict(r);
    const quick=isQuick(m)&&sh.mode==="new";
    let order=sh.mode==="fault"?["X"]:sh.mode==="edit"?ORDERS[ACT.includes(sh.prev.f)&&ORDERS[sh.prev.f]?sh.prev.f:"A"].slice():quick?QUICK_ORDER.filter(k=>k!=="X"&&closing(T,k).length):ORDERS[guess].slice();
    if(sh.mode==="edit"){const e=effective(m.sets[sh.si]).find(x=>x.id===sh.ref);if(!e){ui.sheet=null;return}}
    if(isLib&&sh.mode!=="edit")order=order.filter(k=>!["S","A","B"].includes(k));
    const hot=sh.mode==="new"&&!quick?order[0]:null;
    const c=sh.mode==="edit"?r.ctx[sh.ref]||{}:null;
    const title=sh.mode==="edit"?"Corregir jugada":sh.mode==="fault"?"Falta nuestra":p?esc(p.name):"Sin jugador";
    const sub=sh.mode==="edit"?`Set ${sh.si+1} · rally ${c.rally} · ${c.us}-${c.them}`:sh.mode==="fault"?`Punto para el rival · ${r.cur.us}-${r.cur.them}`:p?`${POS[p.pos]||""} · ${r.cur.us}-${r.cur.them}`:`Se apunta sin jugador y queda pendiente · ${r.cur.us}-${r.cur.them}`;
    const showChips=sh.mode==="edit"||sh.mode==="fault";
    const chips=showChips?`<div class="frow"><span class="fn">${sh.mode==="fault"?"¿Quién? (opcional)":"Jugador"}</span><div class="pchips">${sheetPlayers(m).map(q=>`<button class="pchip${q.pos==="LIB"?" lib":""}" data-act="pickp" data-id="${q.id}" aria-pressed="${sh.p===q.id}">#${esc(q.num)} ${esc(q.name)}</button>`).join("")}<button class="pchip" data-act="pickp" data-id="" aria-pressed="${!sh.p}">${sh.mode==="fault"?"Equipo":"Sin jugador"}</button></div></div>`:"";
    inner=`<header><div class="row">${sh.mode==="fault"?"":jersey(p,true)}<div><div style="font-weight:700;font-size:20px">${title}</div><div class="muted small">${sub}</div></div></div><button class="btn sm" data-act="close">Cerrar</button></header>
    ${chips}

    ${order.map(k=>`<div class="frow ${k===hot&&sh.mode==="new"?"hot":""}"><span class="fn">${FUND[k].n}</span>${m.zones&&sh.mode!=="fault"&&(k==="S"||k==="A")?zpick(k,sh):""}<div class="opts">${(quick?closing(T,k):FUND[k].o).map(o=>{const w=T[k]&&T[k][o[0]];const was=sh.prev&&sh.prev.f===k&&sh.prev.r===o[0];
      return`<button class="opt ${k==="X"?"r-bad":rclass(k,o[0],T)}${was?" was":""}" data-act="log" data-f="${k}" data-r="${esc(o[0])}">${k==="X"?"":`<b>${esc(o[0])}</b>`}${esc(o[1])}${w?`<small>${w==="us"?"+1 nosotros":"+1 rival"}</small>`:""}</button>`}).join("")}</div></div>`).join("")}
    ${sh.mode==="edit"?`<div class="row"><button class="btn danger" data-act="delev">Borrar esta jugada</button></div>`:""}`;
  }
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Jugada">${inner}</div>`;
  document.body.appendChild(el);
  const first=el.querySelector(".opt");if(first)first.focus({preventScroll:true});

function viewLineup(){
  const m=S.matches[ui.liveId],lu=ui.lu;if(!m||!lu){ui.view="live";return viewLive()}
  const P=pmap(m),pl=sheetPlayers(m),n=lu.si==="new"?m.sets.length+1:lu.si+1;

/* ---------- Estadísticas ---------- */
function blank(){return{S:{t:0,"#":0,"=":0,"+":0,"!":0,"-":0,"/":0},R:{t:0,"#":0,"+":0,"-":0,"=":0,"!":0,"/":0},A:{t:0,"#":0,"+":0,"/":0,"=":0},B:{t:0,"#":0,"+":0,"=":0,"/":0},D:{t:0,"#":0,"+":0,"=":0},E:{t:0,"#":0,"+":0,"=":0},X:{t:0},pts:0,err:0}}
/* Reúne jugadas y rallies de los partidos elegidos, con el contexto calculado por replay */
function gather(scope,setFilter){const list=[],rallies=[];
  for(const m of scope){const r=replay(m);r.sets.forEach((st,si)=>{if(setFilter!=="all"&&si!==+setFilter)return;
    st.evs.forEach(e=>{const c=r.ctx[e.id];if(!c.extra)list.push({e,m,c})});st.rallies.forEach(x=>rallies.push({x,m}))})}
  return{list,rallies}}
function computeStats(g){
  const per={},T=blank();const team={ours:0,rivalErr:0,ourErr:0,rivalPts:0,soT:0,soW:0,brT:0,brW:0,rcT:0,rcW:0,fbW:0,svErr:0};const errBy={};
  const rot={},K={};
  const row=(m,pid)=>{const key=m.id+":"+pid;return per[key]||(per[key]=Object.assign(blank(),{p:pmap(m)[pid]||{num:"?",name:"?"},pid,on:0,pm:0}))};
  /* modSO: side-out solo en los rallies con nuestra recepción apuntada (sin los errores de saque del rival). FBSO: de esos, los ganados con el primer ataque (K1) */
  const fb=x=>x.win==="us"&&x.winF==="A"&&typeof x.winCx==="string"&&x.winCx.indexOf("K1")===0;
  for(const{x,m}of g.rallies){if(x.court&&x.win)for(const pid of x.court){if(!pid)continue;const o=row(m,pid);o.on++;o.pm+=x.win==="us"?1:-1}
    const rc=x.sv==="them"&&x.recQ!=null;
    if(x.sv==="them"){team.soT++;if(x.win==="us")team.soW++;if(rc){team.rcT++;if(x.win==="us")team.rcW++;if(fb(x))team.fbW++}else if(x.win==="us"&&x.winF==="RE"&&x.evs.length===1)team.svErr++}else{team.brT++;if(x.win==="us")team.brW++}
    if(x.rot){const o=rot[x.rot]||(rot[x.rot]={soT:0,soW:0,brT:0,brW:0,w:0,l:0,rcT:0,fbW:0});if(x.sv==="them"){o.soT++;if(x.win==="us")o.soW++;if(rc){o.rcT++;if(fb(x))o.fbW++}}else{o.brT++;if(x.win==="us")o.brW++}x.win==="us"?o.w++:o.l++}}
  for(const{e,m,c}of g.list){
    if(e.f==="T")continue;
    if(e.f==="RE"){team.rivalErr++;continue}if(e.f==="RP"){team.rivalPts++;continue}
    if(!ACT.includes(e.f))continue;
    if(e.f==="A"&&c.cx){const k=K[c.cx]||(K[c.cx]={t:0,"#":0,"=":0,"/":0,"+":0});k.t++;k[e.r]=(k[e.r]||0)+1}
    if(c.win==="us")team.ours++;
    if(c.win==="them"){team.ourErr++;const lbl=e.f==="A"&&e.r==="/"?"Ataque bloqueado":e.f==="X"?"Faltas":FUND[e.f].n;errBy[lbl]=(errBy[lbl]||0)+1}
    const tg=[T];if(e.p)tg.push(row(m,e.p));
    for(const tgt of tg){const b=tgt[e.f];if(!b)continue;b.t++;if(e.f!=="X")b[e.r]=(b[e.r]||0)+1;if(c.win==="us")tgt.pts++;if(c.win==="them")tgt.err++}
  }
  /* En la temporada se une por id de jugador: si cambia el nombre o el dorsal, sigue siendo la misma fila (con el nombre actual de la plantilla) */
  const cur={};S.team.players.forEach(p=>cur[p.id]=p);
  const merged={};for(const k in per){const s=per[k];const mk=s.pid;if(cur[mk])s.p=cur[mk];if(!merged[mk]){merged[mk]=s;continue}const t=merged[mk];
    for(const f of"SRABDEX")for(const r in s[f])t[f][r]=(t[f][r]||0)+s[f][r];t.pts+=s.pts;t.err+=s.err;t.on+=s.on;t.pm+=s.pm}
  return{rows:Object.values(merged).sort((a,b)=>(+a.p.num)-(+b.p.num)),T,team,errBy,rot,K,hasCourt:g.rallies.some(({x})=>x.court)};
}
function eff(n,d){if(!d)return"–";const v=Math.round(n*100/d);return`<span class="${d<3?"low":""}" title="${n} sobre ${d}"><span class="${v>0?"pos":v<0?"neg":""}">${v>0?"+":""}${v}%</span><span class="nn">${d}</span></span>`}
function statRow(s,label,cls,court){const S_=s.S,R=s.R,A=s.A;const pm=s.pm||0;
  return`<tr class="${cls||""}"><td class="l">${label}</td>${court?s.on==null?`<td>–</td><td>–</td>`:`<td>${s.on||"–"}</td><td class="${pm>0?"pos":pm<0?"neg":""}">${s.on?(pm>0?"+":"")+pm:"–"}</td>`:""}<td>${s.pts}</td><td>${s.err}</td>
  <td class="grp">${S_.t}</td><td>${S_["#"]}</td><td>${S_["="]}</td><td>${eff(S_["#"]+S_["+"]+S_["/"]-S_["="]-S_["-"],S_.t)}</td>
  <td class="grp">${R.t}</td><td>${pctN(R["#"]+R["+"],R.t)}</td><td>${pctN(R["#"],R.t)}</td><td>${R["="]}</td>
  <td class="grp">${A.t}</td><td>${A["#"]}</td><td>${A["="]}</td><td>${A["/"]}</td><td>${pctN(A["#"],A.t)}</td><td>${eff(A["#"]-A["="]-A["/"],A.t)}</td>
  <td class="grp">${s.B["#"]}</td><td>${s.D.t}</td><td>${s.X.t}</td></tr>`}
function momentum(m,r,setFilter){
  const ev=[];r.sets.forEach((st,si)=>{if(setFilter==="all"||si===+setFilter)st.rallies.forEach(x=>ev.push({s:si,d:x.us-x.them+(x.win==="us"?1:-1)}))});if(ev.length<2)return"";
  const W=640,H=200,pl=16,pr=16,pt=28,pb=16;let d=0;const pts=[];let lastS=-1;const seps=[];
  ev.forEach((e,i)=>{if(e.s!==lastS){seps.push({i,s:e.s});lastS=e.s}pts.push(e.d)});
  const mx=Math.max(4,...pts.map(Math.abs));const mid=pt+(H-pt-pb)/2;const half=(H-pt-pb)/2;
  const x=i=>pl+i*(W-pl-pr)/(ev.length-1);const y=v=>mid-v*half/mx;
  const segs=seps.map((s,k)=>{const end=k+1<seps.length?seps[k+1].i:ev.length;let p="";for(let i=s.i;i<end;i++)p+=(i===s.i?"M":"L")+x(i).toFixed(1)+" "+y(pts[i]).toFixed(1);return`<path class="lu" d="${p}"/>`}).join("");
  return`<div class="zone chart"><p class="hand">Quién iba por delante, punto a punto</p>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diferencia de puntos a lo largo del partido">
    <line class="zero" x1="${pl}" x2="${W-pr}" y1="${mid}" y2="${mid}"/>
    ${seps.map(s=>`<line class="ax" x1="${x(s.i)}" x2="${x(s.i)}" y1="${pt-4}" y2="${H-pb}"/><text x="${x(s.i)+5}" y="${pt-10}">Set ${s.s+1}</text>`).join("")}
    <text class="h us" x="${W-pr}" y="${pt+14}" text-anchor="end">+${mx} nosotros</text><text class="h them" x="${W-pr}" y="${H-pb-4}" text-anchor="end">+${mx} rival</text>
    ${segs}</svg>
  <div class="muted small">Por encima de la línea central íbamos ganando. Cada set empieza de cero.</div></div>`;
}
/* Temporada: sin el ejemplo, sin los partidos marcados «no cuenta» y, si se elige, solo una competición (sin distinguir mayúsculas, tildes ni espacios) */
const compKey=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").trim().toLowerCase().replace(/\s+/g," ");
function compList(){const o={};Object.values(S.matches).filter(m=>!m.example&&!m.noSeason).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||String(a.id).localeCompare(String(b.id))).forEach(m=>{const k=compKey(m.comp);if(!o[k])o[k]={k,label:String(m.comp||"").trim()||"Sin competición",n:0};o[k].n++});return Object.values(o)}
function seasonMatches(){const base=sortedMatches().filter(m=>!m.example&&!m.noSeason);const c=ui.statsComp;return c!=null?base.filter(m=>"c:"+compKey(m.comp)===c):base}

function compLabel(){const c=ui.statsComp;if(c==null)return"";const x=compList().find(y=>"c:"+y.k===c);return x?x.label:""}
function checkComp(){if(ui.statsComp!=null&&!compList().some(c=>"c:"+c.k===ui.statsComp))ui.statsComp=null}

/* Mapas de saque y ataque (solo jugadas con zona) y distribución del ataque por zona de origen */
function mapZone(g,st){if(!g.list.some(({e})=>(e.f==="S"||e.f==="A")&&(e.z||e.zo)))return"";
  const k=ui.mapK==="S"?"S":"A";const withAny=st.rows.filter(x=>x.pid&&g.list.some(({e})=>e.f===k&&e.p===x.pid&&(e.z||e.zo)));
  if(ui.mapP&&ui.mapP!=="all"&&!withAny.some(x=>x.pid===ui.mapP))ui.mapP="all";const pid=ui.mapP||"all";

  const cell=z=>{const es=wz.filter(e=>e.z===z),n=es.length,good=es.filter(e=>e.r==="#").length,sh=tot?n/tot:0;

function viewStats(){
  const ms=sortedMatches();
  if(!ms.length)return`<div class="sheetcard empty"><h2>Aún no hay estadísticas</h2><p class="muted">Cuando apuntes jugadas en un partido, aquí verás puntos, errores y eficacia por jugador.</p><button class="btn primary" data-go="live">Ir al partido</button></div>`;

  const nsNote=season&&nNo?`<div class="muted small">${nn(nNo,"partido no cuenta","partidos no cuentan")} en la temporada (se cambia en Partidos › Datos).</div>`:"";
  const won=t.ours+t.rivalErr,lost=t.ourErr+t.rivalPts;
  const errMax=Math.max(1,...Object.values(st.errBy));
  const errBars=Object.entries(st.errBy).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><span class="t"><i style="width:${v*100/errMax}%"></i></span><span class="n">${v}</span></div>`).join("");
  const result=m?`<div class="setline">${setChips(r,false)}<span>${r.wonUs}-${r.wonThem}${r.finished?"":" · en juego"}</span></div>`:"";
  const nq=scope.filter(isQuick).length;
  let ngap=0;scope.forEach(x=>replay(x).sets.forEach((st,si)=>{if(season||ui.statsSet==="all"||si===+ui.statsSet)ngap+=st.gap}));
  const gnote=ngap?`<div class="note" style="box-shadow:inset 0 0 0 2px var(--mid)"><div class="small">${nn(ngap,"punto quedó","puntos quedaron")} sin apuntar («Me he perdido puntos»). Cuentan en el marcador, pero no en side-out, break, rotaciones ni +/−: esos porcentajes salen de los rallies apuntados.</div></div>`:"";
  const qnote=nq?`<div class="note" style="box-shadow:inset 0 0 0 2px var(--mid)"><div class="small">${season?`${nq} de ${scope.length} partidos se apuntaron`:"Este partido se apuntó"} en modo rápido: solo cómo acabó cada rally. Recepción, defensa, eficacia de saque y K1/K2 están incompletas${season?" en esos partidos":""}; marcador, side-out, break, rotaciones y puntos y errores por jugador sí son completos.</div></div>`:"";
  return`<div class="zone"><div class="row spread"><h2>Estadísticas</h2><div class="row"><button class="btn sm" data-act="img">Imagen para el equipo</button><button class="btn sm" data-act="print">Hoja para imprimir</button><button class="btn sm" data-act="copy">Copiar resumen</button><button class="btn sm" data-act="csv">Descargar CSV</button></div></div>
    <div>${sel}</div>${setSeg}${compSeg}${nsNote}${result}</div>
  ${qnote}${gnote}
  <div class="zone"><div class="figs">
    <div class="fig us"><span class="k">Puntos ganados</span><span class="v">${won}</span><span class="s">${t.ours} nuestros · ${t.rivalErr} por error del rival</span></div>
    <div class="fig them"><span class="k">Puntos regalados</span><span class="v">${t.ourErr}</span><span class="s">${pct(t.ourErr,lost)} de los ${lost} perdidos fueron fallo nuestro</span></div>
    <div class="fig"><span class="k">Side-out</span><span class="v">${pct(t.soW,t.soT)}</span><span class="s">${t.soW} de ${t.soT} con saque del rival</span></div>
    <div class="fig"><span class="k">Break point</span><span class="v">${pct(t.brW,t.brT)}</span><span class="s">${t.brW} de ${t.brT} con nuestro saque</span></div>
    <div class="fig"><span class="k">Side-out recibiendo</span><span class="v">${pct(t.rcW,t.rcT)}</span><span class="s">${t.rcT?`${t.rcW} de ${t.rcT} con recepción apuntada`:"Apunta las recepciones para verlo"}${t.svErr?` · sin ${nn(t.svErr,"error","errores")} de saque rival`:""}</span></div>
    <div class="fig"><span class="k">Al primer ataque</span><span class="v">${pct(t.fbW,t.rcT)}</span><span class="s">${t.rcT?`${t.fbW} de ${t.rcT} recepciones acaban en punto en el K1`:"Necesita recepciones y ataques"}</span></div>
  </div></div>
  ${m?momentum(m,r,ui.statsSet):""}
  ${rotZone(st)}
  ${mapZone(g,st)}
  ${season?evoZone(scope,st.rows):""}
  <div class="zone"><p class="hand them">Dónde fallamos</p>${errBars?`<div class="bars">${errBars}</div>`:`<p class="muted">Sin errores apuntados en esta selección.</p>`}</div>
  <div class="zone"><p class="hand">Por jugador</p>
  ${st.rows.length?`<div class="tablebox"><table class="st"><thead>
    <tr><th class="l"></th>${st.hasCourt?`<th colspan="2" class="grp">En pista</th>`:""}<th colspan="2"></th><th colspan="4" class="grp">Saque</th><th colspan="4" class="grp">Recepción</th><th colspan="6" class="grp">Ataque</th><th colspan="3" class="grp">Otros</th></tr>
    <tr><th class="l">Jugador</th>${st.hasCourt?`<th title="Rallies jugados en pista">Rallies</th><th title="Rallies ganados menos perdidos con el jugador en pista">+/−</th>`:""}<th>Pts</th><th>Err</th><th class="grp">Tot</th><th>Ace</th><th>Err</th><th>Efic.</th><th class="grp">Tot</th><th>Pos.</th><th>Perf.</th><th>Err</th><th class="grp">Tot</th><th>Pto</th><th>Err</th><th>Blq</th><th>% Pto</th><th>Efic.</th><th class="grp">Bloq.</th><th>Def.</th><th>Faltas</th></tr></thead>
    <tbody>${st.rows.map(s=>statRow(s,`<span class="num">${esc(s.p.num)}</span> <span class="cl">${esc(s.p.name)}</span>`,"",st.hasCourt)).join("")}${statRow(st.T,"Equipo","tot",st.hasCourt)}</tbody></table></div>
    ${helpBox()}
    <p class="muted small" style="margin:0">El número pequeño junto a cada porcentaje es cuántas acciones hay detrás; con menos de 3 sale atenuado. Eficacia de saque = (aces + positivos − errores) / saques. Eficacia de ataque = (puntos − errores − bloqueados) / ataques. Recepción positiva = perfectas (#) + positivas (+). El equipo incluye las jugadas sin jugador asignado.${st.hasCourt?" En pista: rallies que ha jugado (solo en sets con alineación; el líbero cuenta cuando está dentro) y +/− = rallies ganados menos perdidos con él en pista.":""}</p>`:`<p class="muted">Sin jugadas de jugadores en esta selección.</p>`}</div>`;
}

function helpBox(){const H=[["Side-out","Rallies ganados cuando saca el rival. Es la capacidad de recuperar el saque."],["Break","Rallies ganados con nuestro saque."],["Side-out recibiendo (modSO)","Side-out contando solo los rallies con nuestra recepción apuntada: quita los errores de saque del rival, que no dependen de nosotros."],["Al primer ataque (FBSO)","Recepciones tras las que ganamos el punto en el primer ataque (K1), sin defensa de por medio."],["Zonas","Campo rival visto desde el nuestro: 2-3-4 junto a la red, 9-8-7 en medio, 1-6-5 al fondo. Origen del ataque en nuestro campo: 4-3-2 delante, 5-6-1 detrás."],["Rotación R1…R6","Dónde está el colocador al empezar el rally: R1 = en P1."],["K1 / K2","K1: el primer ataque después de recibir. K2: el contraataque, después de una defensa o un bloqueo."],["Eficacia","Lo bueno menos lo malo, partido por el total. Puede ser negativa."],["% Pto","Ataques que acaban en punto, sobre el total de ataques."],["Recepción positiva","Recepciones perfectas (#) o positivas (+)."],["+/−","Rallies ganados menos perdidos mientras el jugador estaba en pista."],["#  +  !  −  /  =","Perfecto o punto · positivo · en juego · negativo · bloqueado (en saque: positivo) · error."]];
  return`<details class="help"><summary>¿Qué significa cada cifra?</summary><dl>${H.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></details>`}

/* Side-out y break por rotación (posición del colocador) y ataque K1 frente a K2 */
function rotZone(st){const R=st.rot,K=st.K;const has=Object.keys(R).length;
  const rows=[1,2,3,4,5,6].map(n=>{const o=R[n];if(!o)return`<tr><td class="l"><b>R${n}</b> <span class="muted small">P${n}</span></td><td colspan="5" class="muted">–</td></tr>`;const d=o.w-o.l;
    return`<tr><td class="l"><b>R${n}</b> <span class="muted small">P${n}</span></td><td>${pctN(o.soW,o.soT)}</td><td>${pctN(o.fbW,o.rcT)}</td><td>${pctN(o.brW,o.brT)}</td><td>${o.w}-${o.l}</td><td class="${d>0?"pos":d<0?"neg":""}">${d>0?"+":""}${d}</td></tr>`}).join("");
  const KL=[["K1+","K1 · recepción buena"],["K1-","K1 · recepción mala"],["K1?","K1 · sin recepción"],["K2","K2 · contraataque"]];
  const krows=KL.filter(([k])=>K[k]).map(([k,l])=>{const o=K[k];return`<tr><td class="l">${l}</td><td>${o.t}</td><td>${o["#"]}</td><td>${o["="]}</td><td>${o["/"]}</td><td>${pctN(o["#"],o.t)}</td><td>${eff(o["#"]-o["="]-o["/"],o.t)}</td></tr>`}).join("");
  const rz=has?`<div class="zone"><p class="hand">Por rotación</p><div class="tablebox"><table class="st rtab"><thead><tr><th class="l">Rotación</th><th>Side-out</th><th title="Recepciones ganadas con el primer ataque">1.er ataque</th><th>Break</th><th>G-P</th><th>+/−</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted small" style="margin:0">R1…R6 = dónde está el colocador al empezar el rally. Side-out: rallies ganados con saque del rival. 1.er ataque (FBSO): recepciones que acaban en punto en el primer ataque. Break: rallies ganados con nuestro saque. G-P: rallies ganados y perdidos.</p></div>`:`<div class="zone"><p class="hand">Por rotación</p><p class="muted" style="margin:0">Pon la alineación de cada set (con el colocador) para ver side-out y break en cada rotación.</p></div>`;
  return rz+`<div class="zone"><p class="hand">Ataque por fase</p>${krows?`<div class="tablebox"><table class="st ktab"><thead><tr><th class="l">Fase</th><th>Tot</th><th>Pto</th><th>Err</th><th>Blq</th><th>% Pto</th><th>Efic.</th></tr></thead><tbody>${krows}</tbody></table></div>
    <p class="muted small" style="margin:0">K1: primer ataque después de nuestra recepción (buena = # o +; mala = −). K2: cualquier ataque después de una defensa, un bloqueo o nuestro saque.</p>`:`<p class="muted" style="margin:0">Sin ataques apuntados en esta selección.</p>`}</div>`}

function summaryText(){
  const{season,scope}=statsScope();
  const st=computeStats(gather(scope,season?"all":ui.statsSet)),t=st.team;let out="";
  if(season)out+=`${S.team.name} · Temporada${compLabel()?" · "+compLabel():""} (${nn(scope.length,"partido","partidos")})\n`;else{const m=scope[0],r=replay(m);out+=`${S.team.name} ${r.wonUs}-${r.wonThem} ${m.rival} (${fdate(m.date)})${ui.statsSet!=="all"?` · solo el set ${+ui.statsSet+1}`:""}\n`+r.sets.filter(s=>s.us+s.them).map(s=>s.us+"-"+s.them).join(", ")+"\n"}
  out+=`Side-out ${pct(t.soW,t.soT)} (${t.soT}) · Break ${pct(t.brW,t.brT)} (${t.brT})${t.rcT?` · Side-out recibiendo ${pct(t.rcW,t.rcT)} · Al primer ataque ${pct(t.fbW,t.rcT)} (${t.rcT})`:""}\nPuntos nuestros ${t.ours} · Errores rival ${t.rivalErr} · Errores nuestros ${t.ourErr}\n`;
  const rk=Object.keys(st.rot);if(rk.length)out+="Side-out por rotación: "+rk.map(n=>`R${n} ${pct(st.rot[n].soW,st.rot[n].soT)} (${st.rot[n].soT})`).join(", ")+"\n";
  const top=st.rows.slice().sort((a,b)=>b.pts-a.pts).slice(0,3).filter(s=>s.pts);
  if(top.length)out+="Más puntos: "+top.map(s=>`#${s.p.num} ${s.p.name} ${s.pts}`).join(", ")+"\n";
  const eb=Object.entries(st.errBy).sort((a,b)=>b[1]-a[1]);if(eb.length)out+="Errores: "+eb.map(([k,v])=>k+" "+v).join(", ")+"\n";
  return out;
}
function csvText(){
  const{scope}=statsScope();
  const q=v=>{v=v==null?"":String(v);return/[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  /* Texto libre que empieza por = + - @ : se le pone ' delante para que la hoja de cálculo no lo ejecute como fórmula */
  const tx=v=>{v=v==null?"":String(v);return/^[=+\-@\t\r]/.test(v)?"'"+v:v};
  const rows=[["fecha","rival","competicion","set","rally","marcador_nosotros","marcador_rival","saca","rotacion","fase","complejo","dorsal","jugador","fundamento","codigo","resultado","punto_para","entra","sale","hora","video_seg","zona_origen","zona_destino"]];
  scope.forEach(m=>{const P=pmap(m),r=replay(m);r.sets.forEach(st=>st.evs.forEach(e=>{const c=r.ctx[e.id];if(c.extra)return;const p=P[e.p];
    const fn=e.f==="T"?"Tiempo muerto":e.f==="SUB"?"Cambio":e.f==="LIB"?"Cambio de líbero":e.f==="GAP"?"Puntos sin apuntar":TEAMF[e.f]||FUND[e.f].n;const gp=e.f==="GAP";const pi=P[e.pin],po=P[e.pout];
    rows.push([m.date,tx(m.rival),tx(m.comp),c.set+1,c.rally,gp?e.us:c.us+(c.win==="us"?1:0),gp?e.them:c.them+(c.win==="them"?1:0),c.sv==="us"?"nosotros":"rival",c.rot||"",c.ph==="SO"?"side-out":"break",c.cx||"",p?p.num:"",p?tx(p.name):"",fn,e.f==="T"?(e.side==="us"?"nuestro":"rival"):e.r,ACT.includes(e.f)?optLabel(e.f,e.r):"",c.win==="us"?"nosotros":c.win==="them"?"rival":"",pi?pi.num:"",po?po.num:"",e.t?new Date(e.t).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"",e.vt!=null?e.vt:"",e.zo||"",e.z||""])}))});
  return"﻿"+rows.map(r=>r.map(q).join(";")).join("\n");
}

/* Plantilla en bloque: "4 Marta REC" por línea. Devuelve qué se añade, qué se actualiza y qué no se entiende */
const POSALIAS={COL:"COL",COLOCADOR:"COL",COLOCADORA:"COL",S:"COL",REC:"REC",RECEPTOR:"REC",RECEPTORA:"REC",PUNTA:"REC",OH:"REC",CEN:"CEN",CENTRAL:"CEN",MB:"CEN",OPU:"OPU",OPUESTO:"OPU",OPUESTA:"OPU",OP:"OPU",LIB:"LIB",LIBERO:"LIB",LÍBERO:"LIB",L:"LIB",UNI:"UNI",UNIVERSAL:"UNI"};
function parseRoster(txt){const ok=[],bad=[],seen=new Set();
  txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{const m=l.match(/^#?(\d{1,2})[\s.,;:\-]+(.+)$/);if(!m){bad.push(l);return}
    let name=m[2].trim(),pos=null;const w=name.split(/[\s,;]+/);const last=(w[w.length-1]||"").toUpperCase();if(w.length>1&&POSALIAS[last]){pos=POSALIAS[last];name=w.slice(0,-1).join(" ").replace(/[,;\s]+$/,"")}
    const num=+m[1];if(seen.has(num)){bad.push(l+" (dorsal repetido)");return}seen.add(num);ok.push({num,name,pos})});
  return{ok,bad}}
function bigText(){try{return localStorage.getItem(LS_KEY+"-letra")==="grande"}catch(e){return false}}
function applyBig(){document.documentElement.classList.toggle("big",bigText())}

const nn=(n,one,many)=>n+" "+(n===1?one:many);

  if(ui.wipeAsk&&!acc)body+=`<div class="frow"><span class="small">Se borran la plantilla y todos los partidos de este dispositivo, para siempre. Si quieres conservarlos, descarga antes una copia.</span><div class="row"><button class="btn sm danger" data-act="wipeyes">Borrar todos los datos</button><button class="btn sm" data-act="wipeno">Cancelar</button></div></div>`;
  if(rs&&rs.open){body+=rs.d?`<div class="frow"><span class="small"><b>Esta copia trae:</b> ${nn(rs.add,"partido nuevo","partidos nuevos")}${rs.back?` (${rs.back===1?"lo":"los"} habías borrado)`:""}, ${nn(rs.upd,"con jugadas que aquí no tienes","con jugadas que aquí no tienes")}, ${nn(rs.same,"igual","iguales")}${rs.newPl?` y ${nn(rs.newPl,"jugador nuevo","jugadores nuevos")}`:""}.${rs.byNum?` ${nn(rs.byNum,"jugador se une","jugadores se unen")} a tu plantilla por el dorsal.`:""}${rs.tbl?" También trae su tabla «Qué cierra cada jugada».":""} No se borra nada de lo que ya hay.${rs.clash&&rs.clash.length?`<br><span style="color:var(--mid);font-weight:600">Ojo, mismo dorsal y otro nombre: ${rs.clash.map(esc).join(" · ")}. Sus jugadas pasarán a tu jugador; si no es la misma persona, cambia el dorsal en el fichero de origen.</span>`:""}</span>
      <div class="row"><button class="btn sm primary" data-act="restoredo" ${rs.add||rs.upd||rs.newPl||rs.tbl?"":"disabled"}>Restaurar</button><button class="btn sm" data-act="restorecancel">Cancelar</button></div></div>`
    :`<div class="frow"><label class="f">Elige el fichero .json (copia o partido)<input type="file" id="restore-file" accept=".json,application/json"></label>
      <label class="f">O pega aquí el texto de la copia<textarea id="restore-txt" rows="3" placeholder='{"app":"empat-data",…}'></textarea></label>
      ${rs.err?`<span class="small" style="color:var(--bad)">${esc(rs.err)}</span>`:""}
      <div class="row"><button class="btn sm" data-act="restoretxt">Leer el texto</button><button class="btn sm" data-act="restorecancel">Cancelar</button></div></div>`}
  return`<div class="zone"><p class="hand">Copia de seguridad y partidos recibidos</p>
    <p class="muted small" style="margin:0">Los datos viven en este dispositivo${col?" y en tu cuenta":""}. Descarga una copia de vez en cuando (${nn(n,"partido","partidos")} y la plantilla en un fichero .json); si cambias de móvil o borras el navegador, la restauras aquí. Aquí también se abre un partido que te manden (botón «Enviar» en Partidos): sus jugadores se unen a los tuyos por el dorsal. ${when?`Última copia: ${when}.`:"Aún no has descargado ninguna."}</p>${body}</div>`}
